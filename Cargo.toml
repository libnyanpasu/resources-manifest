[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
manifest-core = { path = "crates/manifest-core" }
manifest-metadata = { path = "crates/manifest-metadata" }
manifest-parser = { path = "crates/manifest-parser" }
manifest-wasm = { path = "crates/manifest-wasm" }

base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2.3"
regex = "1"
tl = "0.7.8"
url = "2.5"

js-sys = "0.3"
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
specta = { version = "^2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
wasm-bindgen = "=0.2.114"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
