[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
manifest-metadata = { path = "crates/manifest-metadata" }
manifest-parser = { path = "crates/manifest-parser" }

indexmap = { version = "2", features = ["serde"] }

schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
specta = { version = "^2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
